related_formalizations: []

status:
  scope: >-
    The compared theorem proves strict determinant positivity for all
    admissible odd exponents D = 2*r+1 and strictly increasing real nodes of
    even cardinality 2*m. The repository additionally proves the fixed
    Pfaffian sign and supporting paired-split determinant inequalities, but
    those auxiliary theorem families are not separately selected in this
    Comparator entry. It does not formalize the even-exponent branch or every
    historical result cited in the manuscript.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

