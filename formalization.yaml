    id: "doi:10.5281/zenodo.21993537"
    type: "paper"
    location: "Zenodo preprint, version 1"
    relationship: "formalizes"
    note: "The repository formalizes the main theorem and its proof chain."
    author_endorsement: "participated"
  - title: "Problemi per le equazioni alle derivate parziali di tipo iperbolico"
    authors:
