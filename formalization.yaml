# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Odd-exponent branch of Colombo's determinant problem"
  description: >-
    This project formalizes the odd-exponent branch of Colombo's determinant
    problem for even matrix size. For every m at least one, every strictly
    increasing x : Fin (2*m) → ℝ, and every r at least m - 1, it proves
    that the determinant of the matrix with entries
    (x_j - x_i)^(2*r+1) is strictly positive. The proof development passes
    through paired truncated-power determinants, B-spline and Marsden
    factorization, total nonnegativity, Volterra propagation, and
    Beta--de Bruijn and Pfaffian identities.
  authors:
    - "Qianli Ma"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Qianli Ma"

classification:
  arxiv: ["math.CA", "math.CO"]
  msc2020: ["15A15", "15B48", "41A15"]

