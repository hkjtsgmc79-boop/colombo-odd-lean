fidelity:
  divergences: >-
    No known divergence affects the compared determinant theorem. The
    formalization uses a project-defined recursive Pfaffian internally and
    proves the determinant consequence. The manuscript's descriptive reverse
    direction for one Volterra support biconditional is not separately exposed
    as a Lean theorem; only the direction used in the proof is formalized. The
    repository does not formalize every historical background theorem.

review:
  status: "self-assessed with informal expert manuscript feedback"
  reviewers:
    - "Qianli Ma"
    - "Fei Yu"
  notes: >-
    Qianli Ma reviewed the mathematical claims, proof interfaces, citations,
    and Lean audit results. Professor Fei Yu of Zhejiang University read an
    earlier version of the proof and provided mathematical and expository
    guidance. This feedback is not presented as journal peer review. Multiple
    AI agents also performed independent semantic red-team reviews.

alignment:
  namespace: "ColomboPalomar"
  statements:
    - source: "Main determinant conclusion"
      lean: "ColomboPalomar.odd_colombo_determinant_positive"
      module: "Solution"
      status: "proved"
      note: >-
        This is the strictly ordered-node form of the odd-exponent determinant
        conclusion: for m at least one and r at least m - 1, the determinant
        of the 2*m by 2*m matrix with entries
        (x_j - x_i)^(2*r+1) is positive.

