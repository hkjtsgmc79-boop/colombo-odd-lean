name: Lean verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit production source
        run: python3 scripts/audit_source.py

      - name: Run exact regression guards
        run: |
          python3 guards/odd_branch_beta_split_guard.py
          python3 guards/odd_branch_seam_to_pfaffian_redteam.py
          python3 guards/odd_branch_staircase_closure_exact.py

      - name: Build the Lean library
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: true
          use-mathlib-cache: true

      - name: Print representative theorem axioms
        run: |
          lake env lean Audit.lean | tee /tmp/colombo-axioms.log
          python3 scripts/check_axiom_output.py /tmp/colombo-axioms.log
